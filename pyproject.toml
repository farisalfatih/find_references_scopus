[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "find-refs"
version = "2.0.0"
description = "CLI tool for finding (OpenAlex), validating, filtering, and exporting academic references with offline Scopus/SCImago indexing detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Find-Refs Team" }]
keywords = [
  "references", "bibtex", "scopus", "scimago", "openalex",
  "academic", "research", "cli", "citation", "bibliography"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "requests>=2.31.0",
  "requests-cache>=1.2.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomli-w>=1.0.0",
  "platformdirs>=4.2.0",
  "questionary>=2.0.1",
  "bibtexparser>=2.0.0b7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4.0",
  "mypy>=1.8",
]

[project.scripts]
findref = "find_references_scopus.cli:app"
find-refs = "find_references_scopus.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["find_references_scopus*"]

[tool.setuptools.package-data]
"find_references_scopus" = ["data/*.json", "data/*.txt", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
