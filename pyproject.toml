[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "find-references-scopus"
version = "1.0.0"
description = "Pipeline untuk fetch, filter, deduplikasi, dan konversi artikel ilmiah dari OpenAlex berdasarkan daftar ISSN SCImago"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Research Pipeline" }]
dependencies = [
    "requests>=2.28.0",
    "nltk>=3.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
find-refs = "find_references_scopus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["find_references_scopus*"]

[tool.ruff]
line-length = 100
target-version = "py38"
