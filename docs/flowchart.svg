<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
  <!-- Definisi gradient & marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stepFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="utilFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="configFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="outFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="url(#bg)"/>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">
    Pipeline Find References Scopus
  </text>
  <text x="700" y="65" text-anchor="middle" font-size="14" fill="#475569">
    Fetch, filter, deduplikasi &amp; konversi artikel OpenAlex berbasis ISSN SCImago
  </text>

  <!-- Config box (sumber) -->
  <rect x="40" y="100" width="200" height="80" rx="10" fill="url(#configFill)" stroke="#15803d" stroke-width="2"/>
  <text x="140" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">config.yaml</text>
  <text x="140" y="148" text-anchor="middle" font-size="11" fill="#166534">SEARCH_GROUPS, ISSN,</text>
  <text x="140" y="163" text-anchor="middle" font-size="11" fill="#166534">year range, paths</text>

  <!-- SCImago CSV (sumber eksternal) -->
  <rect x="40" y="220" width="200" height="80" rx="10" fill="url(#utilFill)" stroke="#b45309" stroke-width="2"/>
  <text x="140" y="248" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">SCImago CSV</text>
  <text x="140" y="268" text-anchor="middle" font-size="11" fill="#92400e">scimagojr_2025.csv</text>
  <text x="140" y="283" text-anchor="middle" font-size="11" fill="#92400e">(sumber eksternal)</text>

  <!-- Excluded DOIs (sumber eksternal) -->
  <rect x="40" y="600" width="200" height="80" rx="10" fill="url(#utilFill)" stroke="#b45309" stroke-width="2"/>
  <text x="140" y="628" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">excluded_dois.txt</text>
  <text x="140" y="648" text-anchor="middle" font-size="11" fill="#92400e">Daftar DOI yang</text>
  <text x="140" y="663" text-anchor="middle" font-size="11" fill="#92400e">ingin di-exclude</text>

  <!-- Draft Markdown (sumber eksternal untuk step 08) -->
  <rect x="40" y="760" width="200" height="80" rx="10" fill="url(#utilFill)" stroke="#b45309" stroke-width="2"/>
  <text x="140" y="788" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">draft.md</text>
  <text x="140" y="808" text-anchor="middle" font-size="11" fill="#92400e">Draf latar belakang</text>
  <text x="140" y="823" text-anchor="middle" font-size="11" fill="#92400e">penelitian</text>

  <!-- =========== Pipeline Steps =========== -->

  <!-- Step 01: get-issn -->
  <rect x="320" y="100" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="430" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 01 — get-issn</text>
  <text x="430" y="145" text-anchor="middle" font-size="11" fill="#1e40af">Ekstrak ISSN electronic</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#1e40af">dari SCImago per quartile</text>

  <!-- Step 02: fetch -->
  <rect x="620" y="100" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="730" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 02 — fetch</text>
  <text x="730" y="145" text-anchor="middle" font-size="11" fill="#1e40af">Fetch artikel dari</text>
  <text x="730" y="160" text-anchor="middle" font-size="11" fill="#1e40af">OpenAlex API per group</text>

  <!-- Step 03: filter -->
  <rect x="920" y="100" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1030" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 03 — filter</text>
  <text x="1030" y="145" text-anchor="middle" font-size="11" fill="#1e40af">Filter keyword di</text>
  <text x="1030" y="160" text-anchor="middle" font-size="11" fill="#1e40af">judul + abstrak</text>

  <!-- Step 04: deduplicate -->
  <rect x="920" y="220" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1030" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 04 — deduplicate</text>
  <text x="1030" y="265" text-anchor="middle" font-size="11" fill="#1e40af">Deduplikasi antar group</text>
  <text x="1030" y="280" text-anchor="middle" font-size="11" fill="#1e40af">berbasis hierarki query</text>

  <!-- Step 05: remove-excluded -->
  <rect x="920" y="340" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1030" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 05 — remove-excluded</text>
  <text x="1030" y="385" text-anchor="middle" font-size="11" fill="#1e40af">Hapus DOI yang ada di</text>
  <text x="1030" y="400" text-anchor="middle" font-size="11" fill="#1e40af">daftar exclude</text>

  <!-- Step 06: distribution -->
  <rect x="920" y="460" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1030" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 06 — distribution</text>
  <text x="1030" y="505" text-anchor="middle" font-size="11" fill="#1e40af">Tampilkan distribusi</text>
  <text x="1030" y="520" text-anchor="middle" font-size="11" fill="#1e40af">artikel per kategori</text>

  <!-- Step 07: merge-journal -->
  <rect x="920" y="580" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1030" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 07 — merge-journal</text>
  <text x="1030" y="625" text-anchor="middle" font-size="11" fill="#1e40af">Tambah info quartile</text>
  <text x="1030" y="640" text-anchor="middle" font-size="11" fill="#1e40af">&amp; open_access dari SCImago</text>

  <!-- Step 08: extract-claims (paralel, butuh draft.md) -->
  <rect x="320" y="760" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="430" y="785" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 08 — extract-claims</text>
  <text x="430" y="805" text-anchor="middle" font-size="11" fill="#1e40af">Ekstrak kalimat berisi</text>
  <text x="430" y="820" text-anchor="middle" font-size="11" fill="#1e40af">DOI dari Markdown</text>

  <!-- Step 09: extract-references -->
  <rect x="620" y="760" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="730" y="785" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 09 — extract-references</text>
  <text x="730" y="805" text-anchor="middle" font-size="11" fill="#1e40af">Format artikel jadi</text>
  <text x="730" y="820" text-anchor="middle" font-size="11" fill="#1e40af">Markdown ringkas</text>

  <!-- Step 10: select-articles -->
  <rect x="920" y="760" width="220" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1030" y="785" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 10 — select-articles</text>
  <text x="1030" y="805" text-anchor="middle" font-size="11" fill="#1e40af">Pilih subset artikel</text>
  <text x="1030" y="820" text-anchor="middle" font-size="11" fill="#1e40af">berdasar daftar DOI</text>

  <!-- Step 11: convert-bib -->
  <rect x="1200" y="760" width="180" height="80" rx="10" fill="url(#stepFill)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1290" y="785" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Step 11 — convert-bib</text>
  <text x="1290" y="805" text-anchor="middle" font-size="11" fill="#1e40af">Konversi JSON</text>
  <text x="1290" y="820" text-anchor="middle" font-size="11" fill="#1e40af">ke file .bib</text>

  <!-- =========== Output files =========== -->
  <rect x="320" y="220" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">01_issn_list.txt</text>
  <text x="430" y="258" text-anchor="middle" font-size="10" fill="#6b21a8">Daftar ISSN (satu/baris)</text>

  <rect x="620" y="220" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">02_openalex_raw.json</text>
  <text x="730" y="258" text-anchor="middle" font-size="10" fill="#6b21a8">{group: [artikel, ...]}</text>

  <rect x="920" y="220" width="220" height="0" rx="8" fill="none"/>

  <!-- Output lain: tumpangkan di bawah step masing-masing -->
  <rect x="620" y="340" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">03_filtered.json</text>
  <text x="730" y="378" text-anchor="middle" font-size="10" fill="#6b21a8">Artikel yang match query</text>

  <rect x="620" y="460" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="480" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">04_deduplicated.json</text>
  <text x="730" y="498" text-anchor="middle" font-size="10" fill="#6b21a8">Artikel unik (DOI tunggal)</text>

  <rect x="620" y="580" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="600" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">05_cleaned.json</text>
  <text x="730" y="618" text-anchor="middle" font-size="10" fill="#6b21a8">Setelah hapus DOI exclude</text>

  <rect x="620" y="700" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="720" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">07_with_journal_info.json</text>
  <text x="730" y="738" text-anchor="middle" font-size="10" fill="#6b21a8">+ quartile, open_access</text>

  <rect x="1200" y="640" width="180" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1290" y="660" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">11_references.bib</text>
  <text x="1290" y="678" text-anchor="middle" font-size="10" fill="#6b21a8">Untuk LaTeX</text>

  <rect x="1200" y="860" width="180" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1290" y="880" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">10_selected.json</text>
  <text x="1290" y="898" text-anchor="middle" font-size="10" fill="#6b21a8">Subset DOI terpilih</text>

  <!-- =========== Arrows =========== -->
  <!-- config -> step 01, 02, 03, 04, 07, 10, 11 (semua baca config) -->
  <line x1="240" y1="140" x2="320" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCImago CSV -> csv-to-json (utility, tidak digambar) & SCImago JSON -> step 01, 07 -->
  <line x1="240" y1="260" x2="320" y2="160" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="270" y="225" font-size="9" fill="#475569" font-style="italic">SCImago JSON</text>

  <!-- Step 01 -> 01_issn_list.txt -->
  <line x1="430" y1="180" x2="430" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 01_issn_list.txt -> Step 02 -->
  <line x1="540" y1="250" x2="620" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 02 -> 02_openalex_raw.json -> Step 03 -->
  <line x1="730" y1="180" x2="730" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="250" x2="920" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 03 -> 03_filtered.json -> Step 04 -->
  <line x1="1030" y1="180" x2="1030" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1030" y1="300" x2="1030" y2="340" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 04 -> 04_deduplicated.json -> Step 05 -->
  <line x1="1030" y1="300" x2="840" y2="480" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="855" y="425" font-size="9" fill="#475569" font-style="italic">04_dedup</text>

  <line x1="840" y1="490" x2="920" y2="380" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 05 + excluded_dois.txt -->
  <line x1="240" y1="640" x2="920" y2="380" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="1030" y1="420" x2="1030" y2="460" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 05 -> 05_cleaned.json -> Step 06 & Step 07 -->
  <line x1="840" y1="610" x2="920" y2="500" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="855" y="545" font-size="9" fill="#475569" font-style="italic">05_cleaned</text>
  <line x1="1030" y1="540" x2="1030" y2="580" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 07 -> 07_with_journal_info.json -->
  <line x1="1030" y1="660" x2="840" y2="720" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="855" y="685" font-size="9" fill="#475569" font-style="italic">07_journal_info</text>

  <!-- 07_with_journal_info.json -> Step 09, Step 10, Step 11 -->
  <line x1="730" y1="760" x2="730" y2="760" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="790" x2="920" y2="790" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1140" y1="790" x2="1200" y2="790" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SCImago JSON -> Step 07 (untuk index jurnal) -->
  <line x1="240" y1="280" x2="920" y2="620" stroke="#475569" stroke-width="1.0" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Step 06 -> output txt -->
  <rect x="620" y="700" width="0" height="0"/>

  <!-- draft.md -> Step 08 -->
  <line x1="240" y1="800" x2="320" y2="800" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 08 -> output claims.json -->
  <rect x="320" y="860" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="430" y="880" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">08_claims.json</text>
  <text x="430" y="898" text-anchor="middle" font-size="10" fill="#6b21a8">Kalimat + DOI unik</text>
  <line x1="430" y1="840" x2="430" y2="860" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 09 output -->
  <rect x="620" y="860" width="220" height="60" rx="8" fill="url(#outFill)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="880" text-anchor="middle" font-size="11" font-weight="600" fill="#581c87">09_references.md</text>
  <text x="730" y="898" text-anchor="middle" font-size="10" fill="#6b21a8">Markdown ringkas</text>
  <line x1="730" y1="840" x2="730" y2="860" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 10 -> 10_selected.json -->
  <line x1="1030" y1="840" x2="1290" y2="860" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 11 -> 11_references.bib -->
  <line x1="1290" y1="840" x2="1290" y2="860" stroke="#475569" stroke-width="0" />

  <!-- =========== Legend =========== -->
  <rect x="40" y="940" width="1320" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="60" y="955" width="20" height="20" rx="3" fill="url(#configFill)" stroke="#15803d"/>
  <text x="90" y="970" font-size="12" fill="#334155">Config / sumber</text>

  <rect x="220" y="955" width="20" height="20" rx="3" fill="url(#stepFill)" stroke="#1d4ed8"/>
  <text x="250" y="970" font-size="12" fill="#334155">Step pipeline</text>

  <rect x="380" y="955" width="20" height="20" rx="3" fill="url(#outFill)" stroke="#7c3aed"/>
  <text x="410" y="970" font-size="12" fill="#334155">File output</text>

  <rect x="540" y="955" width="20" height="20" rx="3" fill="url(#utilFill)" stroke="#b45309"/>
  <text x="570" y="970" font-size="12" fill="#334155">Sumber eksternal</text>

  <line x1="730" y1="965" x2="780" y2="965" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="970" font-size="12" fill="#334155">Aliran data utama</text>

  <line x1="950" y1="965" x2="1000" y2="965" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1010" y="970" font-size="12" fill="#334155">Referensi silang</text>

  <text x="1180" y="970" font-size="11" fill="#64748b" font-style="italic">v1.0 — Refactored</text>
</svg>
